name: SYNTROPY CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Initialize submodules
        run: |
          git submodule update --init --recursive --force
      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q \
            libncurses-dev
      - name: Build submodules
        run: make build
      - name: Build BPF object
        run: make -C K-Scanner bpf CLANG=clang-22
      - name: Verify binaries
        run: |
          test -x K-Scanner/kscanner && ./K-Scanner/kscanner --help
          test -x LinSpec/linspec && ./LinSpec/linspec --help
      - name: ShellCheck scripts
        run: |
          shellcheck --version
          shellcheck -S warning scripts/*.sh
      - name: Docker build
        run: make docker
